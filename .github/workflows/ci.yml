name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      - name: Check formatting (shfmt)
        run: shfmt -i 2 -d .

      - name: Run test suite (shellcheck, drift check, unit, e2e)
        run: ./tests/run.sh

      - name: Lint workflows (zizmor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pipx run zizmor .github/workflows/
